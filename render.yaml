services:
  - type: web
    name: ritos-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ritos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ECOMMERCE_WEBHOOK_SECRET
        sync: false
      - key: SEED_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ACCESS_TOKEN_MINUTES
        value: "30"
databases:
  - name: ritos-db
    plan: basic-256mb
    databaseName: ritos
    user: ritos
